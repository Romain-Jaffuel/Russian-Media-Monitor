  # =========================================================
  # YouTube -- chaines politiques russophones
  #
  # Collecte par les sous-titres, decoupes en segments horodates et cliquables
  # (src/youtube_scrape.py). Biais assume : les quatre chaines les plus vues
  # sont toutes d'opposition en exil, le pendant pro-Kremlin n'etant pas sur
  # la plateforme. Ne pas lire ce volet comme un echantillon de la video
  # russophone.
  # =========================================================

  - name: Maxime Kats (YouTube)
    url: https://www.youtube.com/@Max_Katz/videos
    type: youtube
    media_type: exil
    legal_status: agent_etranger
    historical_stance: "Ancien elu municipal moscovite passe au commentaire politique quotidien. Chaine politique russophone la plus vue (~26 M de vues/mois). Ligne liberale d'opposition, tres critique du Kremlin comme d'une partie de l'opposition. Agent etranger depuis juillet 2022, en exil."

  - name: Varlamov (YouTube)
    url: https://www.youtube.com/@varlamov/videos
    type: youtube
    media_type: exil
    legal_status: agent_etranger
    historical_stance: "Ilia Varlamov, blogueur urbanisme et voyage devenu commentateur politique. ~15 M de vues/mois. Cofondateur avec Kats du fonds Gorodskie Proekty. Agent etranger depuis mars 2023, en exil."

  - name: Chtefanov (YouTube)
    url: https://www.youtube.com/@alexandrshtefanov/videos
    type: youtube
    media_type: exil
    legal_status: agent_etranger
    historical_stance: "Alexandre Chtefanov, historien de formation, angle historique et social de gauche. ~10 M de vues/mois. Auteur du documentaire tourne dans les territoires occupes (2023). Agent etranger depuis aout 2023, a quitte la Russie en fevrier 2024."

  - name: vDud (YouTube)
    url: https://www.youtube.com/@vdud/videos
    type: youtube
    media_type: exil
    legal_status: agent_etranger
    historical_stance: "Iouri Doud, entretiens longs (2 a 4 h) au tres large public, souvent culturels plutot que politiques -- le volume de texte produit depasse largement sa part politique. ~6 M de vues/mois. Agent etranger depuis avril 2022."

  # =========================================================
  # Television -- talk-shows et journaux, via RuTube
  #
  # La TV est le premier support d'information du pays (plus d'un Russe sur
  # deux s'y informe, 41 % de confiance contre 11 % a Telegram) : c'etait
  # l'angle mort du corpus. RuTube est la seule plateforme ou les chaines
  # publient officiellement, mais sans sous-titres -- Whisper transcrit en
  # local, d'ou un nombre d'emissions volontairement restreint.
  # =========================================================

  - name: Vremya Pokazhet (Pervyi Kanal)
    channel: Pervyi Kanal
    url: https://rutube.ru/channel/23460655/videos/
    type: rutube
    program_pattern: "Время покажет"
    media_type: etat
    legal_status: aucun
    historical_stance: "Talk-show politique phare de Pervyi Kanal (3e chaine du pays, 7,1 % de part d'audience), diffuse en journee. Plateau de commentateurs alignes sur la ligne officielle."

  - name: Bolshaya Igra (Pervyi Kanal)
    channel: Pervyi Kanal
    url: https://rutube.ru/channel/23460655/videos/
    type: rutube
    program_pattern: "Большая игра"
    media_type: etat
    legal_status: aucun
    historical_stance: "Talk-show de politique internationale de Pervyi Kanal, centre sur la relation avec les Etats-Unis et l'OTAN. C'est la que se formule la ligne sur l'Occident."

  - name: Soloviev LIVE (RuTube)
    channel: Soloviev LIVE
    url: https://rutube.ru/channel/23484660/videos/
    type: rutube
    program_pattern: "СОЛОВЬЁВ|Соловьёв|Соловьев"
    media_type: etat
    legal_status: aucun
    historical_stance: "Emission de Vladimir Soloviev, la voix la plus explicite de la propagande d'Etat. Diffusee quotidiennement en format long (2 a 4 h)."

  - name: Vremya (Pervyi Kanal)
    channel: Pervyi Kanal
    url: https://rutube.ru/channel/23460655/videos/
    type: rutube
    # Le motif doit exclure « Время покажет », le talk-show du meme groupe :
    # seul le journal porte le prefixe « Выпуск программы ». Le point joker
    # absorbe les guillemets, droits ou typographiques selon les titres.
    program_pattern: "Выпуск программы .Время."
    search_query: "Выпуск программы Время"
    media_type: etat
    legal_status: aucun
    historical_stance: "Journal de 21 h de Pervyi Kanal, le plus suivi de Russie et le programme d'information de reference depuis l'epoque sovietique. Enonce la version officielle des evenements du jour."

  # =========================================================
