  # =========================================================
  # Rossiya 1 -- emissions phares, via interception du flux
  #
  # Premiere chaine du pays (13,4 % d'audience) et longtemps absente du
  # corpus : rien d'exploitable sur RuTube, chaines YouTube retirees, et
  # l'extracteur smotrim de yt-dlp casse. `type: hls` contourne tout ca en
  # ecoutant le trafic du lecteur (cf. src/hls_scrape.py).
  #
  # `program_pattern` est indispensable : ces pages recommandent d'autres
  # emissions et sans filtre on transcrit le voisin. « Вести недели » est
  # ecartee, smotrim ne la publie qu'en sujets de 5 a 10 min sans date.
  # =========================================================

  - name: 60 Minut (Rossiya 1)
    channel: Rossiya 1
    url: https://smotrim.ru/brand/60851
    type: hls
    episode_pattern: '/video/\d+'
    program_pattern: "60 минут"
    media_type: etat
    legal_status: aucun
    historical_stance: "Talk-show politique quotidien d'Olga Skabeeva et Evgueni Popov, deux fois par jour en semaine. Un des lieux les plus explicites du cadrage officiel."

  - name: Vecher s Solovievym (Rossiya 1)
    channel: Rossiya 1
    url: https://smotrim.ru/brand/21385
    type: hls
    episode_pattern: '/video/\d+'
    program_pattern: "Вечер с Владимиром Соловь|Вечер с Соловь"
    media_type: etat
    legal_status: aucun
    historical_stance: "Emission de soiree de Vladimir Soloviev sur Rossiya 1 -- a distinguer de sa chaine en ligne Soloviev LIVE, deja suivie : format et audience differents, l'antenne touchant un public sans commune mesure."

  - name: Segodnya (NTV)
    channel: NTV
    url: https://rutube.ru/channel/23178409/videos/
    type: rutube
    program_pattern: "«Сегодня»"
    search_query: "Сегодня выпуск новостей"
    media_type: etat
    legal_status: aucun
    historical_stance: "Journal quotidien de NTV, deuxieme chaine du pays (9,5 % de part d'audience, devant Pervyi Kanal). Groupe Gazprom-Media, ton plus sensationnaliste que Pervyi Kanal pour une meme ligne editoriale."

  - name: Vypusk novostey (Pervyi Kanal)
    channel: Pervyi Kanal
    url: https://rutube.ru/channel/23460655/videos/
    type: rutube
    # Les editions intrajournalieres (9 h, 12 h, 15 h, 18 h), distinctes du
    # journal de 21 h « Время » collecte a part. Mesure faite sur trois
    # editions du meme jour : elles ne partagent que 15 a 24 % de leur
    # vocabulaire, donc elles ne se repetent pas et valent d'etre collectees.
    program_pattern: "Выпуск новостей"
    search_query: "Выпуск новостей"
    media_type: etat
    legal_status: aucun
    historical_stance: "Editions intrajournalieres de Pervyi Kanal, environ 20 min chacune. Complement du journal de 21 h : chaque edition couvre largement d'autres sujets."

  # =========================================================
  # Television -- NTV et Soloviev LIVE
  #
  # Verifie le 15 aout 2026 : les six emissions sont publiees integralement,
  # date dans le titre, par le compte officiel de leur chaine.
  #
  # A retenir de l'enquete : « Место встречи » et « Формула смысла » avaient
  # ete classees non viables alors qu'elles etaient en relache d'ete -- pas
  # d'episode recent ne veut pas dire pas de source. « Однако » n'est plus une
  # emission mais une rubrique de « Время », donc deja couverte. « Антонимы »
  # est abandonnee, plus rien depuis octobre 2025.
  #
  # Cout : ~20 h d'audio par semaine, soit ~1 h 30 de GPU et ~0,8 $ de
  # Mistral. Le poste le plus lourd -- chaque entree est independante.
  # =========================================================

  - name: Mesto vstrechi (NTV)
    channel: NTV
    url: https://rutube.ru/channel/23178409/videos/
    type: rutube
    program_pattern: "Место встречи"
    search_query: "Место встречи выпуск"
