[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Layout src/ installe en editable (uv sync) : "src" reste importable comme
# aujourd'hui (from src.db import ...) quel que soit le repertoire courant ou
# la profondeur du script qui l'importe -- plus besoin que le script soit a
# la racine du repo pour que la resolution d'import fonctionne.
packages = ["src"]

[project]
name = "russian-media-monitor"
version = "0.1.0"
description = "Veille automatisee des medias russophones : scraping RSS/HTML, analyse Mistral, DuckDB, dashboard Streamlit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # NOYAU : uniquement ce dont le TABLEAU DE BORD a besoin.
    #
    # Tout le reste -- collecte, transcription, analyses -- vit dans l'extra
    # « collecte » ci-dessous. La raison est un hebergeur : Streamlit Cloud
    # installe depuis uv.lock, et il tentait donc de tirer torch CUDA, Whisper
    # et Playwright pour afficher des graphiques, avant d'echouer faute de roue
    # CUDA pour sa plateforme. Les extras, eux, ne sont jamais installes sans
    # etre demandes.
    #
    # EN LOCAL, il faut donc :  uv sync --extra collecte
    "streamlit>=1.40",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
collecte = [
    # --- Collecte ---
    "httpx>=0.27",
    "requests>=2.32",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.12",
    "brotli>=1.1.0",
    "langdetect>=1.0.9",
    "yt-dlp>=2025.1.15",
    "playwright>=1.40",
    "pip-system-certs>=5.3",
    # --- Transcription des emissions ---
    "faster-whisper>=1.2",
    "nvidia-cublas-cu12>=12.9",
    "nvidia-cudnn-cu12>=9.0",
    # --- Analyses ---
    "mistralai>=1.2",
    "scikit-learn>=1.5",
    "bertopic>=0.16",
    "sentence-transformers>=3.0",
    "pymorphy3>=1.2",
    "pymorphy3-dicts-ru>=2.4",
    "nltk>=3.9",
    "torch>=2.6",
]

# --- torch en version CUDA -------------------------------------------------
# L'index public de PyPI ne sert que des roues torch CPU. Les embeddings de
# analyze_topics.py tournaient donc sur processeur (9 min pour 8 800 documents
# avec MiniLM, 33 min avec e5-base) alors que la machine a une carte NVIDIA
# deja utilisee par faster-whisper.
#
# A declarer ici et pas via `uv pip install` : `uv run` resynchronise
# l'environnement depuis uv.lock avant chaque execution, et defaisait donc
# l'installation manuelle a la commande suivante.
#
# `explicit = true` : cet index ne sert QUE pour torch, il ne devient pas une
# source pour le reste des dependances.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# Windows seulement : c'est la machine de collecte. Ailleurs -- un
# hebergeur, une machine sans carte -- torch vient de PyPI en version
# processeur, et de toute facon il n'est installe qu'avec l'extra.
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
