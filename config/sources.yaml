# Sources presse Russie, veille des médias russophones sur la Russie.
# `type: scrape` for sites with no usable RSS feed, parsed from their homepage.
# `type: telegram` for a public Telegram channel: `url` must be its t.me/s/
# preview (e.g. https://t.me/s/rybar), scraped without authentication --
# large state channels sometimes disable this preview (rian_ru, rt_russian,
# tvrussia1 confirmed unreachable this way as of August 2026), in which case
# they simply aren't addable through this mechanism.
# Without a `type` key, RSS is assumed.
#
# media_type: etat / para_etat / independant / exil
# legal_status: agent_etranger / organisation_indesirable / aucun
#   (legal status as designated by the Russian Ministry of Justice / Prosecutor
#   General; when an outlet carries both designations, the more restrictive one
#   is used. Checked August 2026 — this list moves fast, re-verify periodically.)
# historical_stance: free-text, hand-written editorial history/lineage of the
#   outlet (who founded it, ownership changes, why it ended up where it is).
#   This is curated by hand, not derived from the data -- update it manually
#   when an outlet's editorial line or ownership changes.
sources:

  # =========================================================
  # Medias d'Etat
  # =========================================================

  - name: RIA Novosti
    url: https://ria.ru/export/rss2/archive/index.xml
    media_type: etat
    legal_status: aucun
    historical_stance: "Agence publique, reprise en main editoriale en 2013-2014 lors de sa fusion forcee dans Rossiya Segodnya"

  - name: Sputnik
    # ru.sputniknews.ru (from the original brief) does not resolve; the live
    # Russian-language domain is sputniknews.ru, corrected after verification.
    url: https://sputniknews.ru/
    type: scrape
    media_type: etat
    legal_status: aucun
    historical_stance: "Marque de propagande exterieure creee par le Kremlin en 2014 (groupe Rossiya Segodnya)"

  - name: RT
    url: https://russian.rt.com/rss
    media_type: etat
    legal_status: aucun
    historical_stance: "Chaine de propagande exterieure lancee par l'Etat en 2005, ligne pro-Kremlin assumee"

  - name: Rossiya 1 / Vesti (VGTRK)
    url: https://www.vesti.ru/
